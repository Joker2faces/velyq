name: CI

on:
  pull_request:
  push:
    branches:
      [
        main,
        feat/phase-1-foundation,
        integration/**,
        claude/velyq-principal-integration,
      ]
  workflow_dispatch:
    inputs:
      staging_smoke:
        description: Run the staging customer and admin smoke tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
  db-integration:
    # Real-database verification for identity/ingestion work: a genuine local
    # Supabase Postgres (via the pinned Supabase CLI, which manages its own
    # Docker containers on this Ubuntu runner), migrated fresh from
    # supabase/migrations, then exercised by packages/database/
    # test-integration -- never production, no provider secrets, no
    # API-Sports calls.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start
      - run: pnpm exec supabase db reset --local
      - run: pnpm test:db-integration
      - if: always()
        run: pnpm exec supabase stop --no-backup
  database-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify
  worker-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm worker:verify
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:reset
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  staging-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_smoke }}
    runs-on: ubuntu-latest
    env:
      VELYQ_STAGING_CUSTOMER_URL: ${{ secrets.VELYQ_STAGING_CUSTOMER_URL }}
      VELYQ_STAGING_CUSTOMER_EMAIL: ${{ secrets.VELYQ_STAGING_CUSTOMER_EMAIL }}
      VELYQ_STAGING_CUSTOMER_PASSWORD: ${{ secrets.VELYQ_STAGING_CUSTOMER_PASSWORD }}
      VELYQ_STAGING_ADMIN_URL: ${{ secrets.VELYQ_STAGING_ADMIN_URL }}
      VELYQ_STAGING_ADMIN_EMAIL: ${{ secrets.VELYQ_STAGING_ADMIN_EMAIL }}
      VELYQ_STAGING_ADMIN_PASSWORD: ${{ secrets.VELYQ_STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config tooling/e2e/staging.playwright.config.ts
