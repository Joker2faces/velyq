name: CI

on:
  pull_request:
  push:
    branches: [main, feat/phase-1-foundation, integration/**]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
  database-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify
  worker-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm worker:verify
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
